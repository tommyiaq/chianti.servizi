<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Chianti Servizi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<!-- Stili in linea: il 404 puo essere servito da qualunque percorso,
     quindi non dipende dai CSS del sito. -->
<style>
  :root { --gold:#c9a961; --ink:#0f0d0a; --cream:#ece5d8; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:grid; place-items:center; text-align:center;
    background:var(--ink); color:var(--cream);
    font-family:'Jost',system-ui,sans-serif; font-weight:300; padding:2rem 1.2rem;
  }
  .code {
    font-family:'Cinzel',serif; font-size:clamp(4rem,12vw,9rem); line-height:1;
    color:var(--gold); letter-spacing:.08em;
  }
  h1 {
    font-family:'Cinzel',serif; font-weight:500; letter-spacing:.1em;
    font-size:clamp(1.2rem,.9rem+1.6vw,1.9rem); margin:1.2rem 0 .8rem; text-transform:uppercase;
  }
  p { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.15rem; color:#a89c88; max-width:46ch; margin-inline:auto; }
  .orn { display:flex; align-items:center; justify-content:center; gap:.8rem; width:200px; margin:1.6rem auto; color:var(--gold); }
  .orn::before, .orn::after { content:''; height:1px; flex:1; background:linear-gradient(90deg,transparent,currentColor); }
  .orn::after { background:linear-gradient(90deg,currentColor,transparent); }
  .orn i { width:7px; height:7px; background:currentColor; transform:rotate(45deg); }
  .links { margin-top:2rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
  .links a {
    display:inline-block; padding:1em 2.2em; border:1px solid var(--gold); color:var(--gold);
    text-decoration:none; font-size:.74rem; letter-spacing:.24em; text-transform:uppercase;
    transition:background .3s, color .3s;
  }
  .links a:hover { background:var(--gold); color:var(--ink); }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Questa confezione &egrave; vuota</h1>
    <div class="orn"><i></i></div>
    <p>La pagina che cercavate non esiste o &egrave; stata spostata.<br>
       <span lang="en">The page you were looking for does not exist or has moved.</span></p>
    <div class="links" id="links"></div>
    <noscript><div class="links"><a href="../">Home</a></div></noscript>
  </main>

<script>
/* Il 404 puo essere servito da qualsiasi sottocartella: ricostruiamo il
   percorso della home dal primo segmento (project page di GitHub Pages). */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var isEn = parts.indexOf('en') !== -1;
  var root = (parts.length && location.hostname.indexOf('github.io') !== -1) ? '/' + parts[0] + '/' : '/';
  var l = document.getElementById('links');
  l.innerHTML =
    '<a href="' + root + (isEn ? 'en/index.html' : 'index.html') + '">' + (isEn ? 'Home' : 'Torna alla home') + '</a>' +
    '<a href="' + root + (isEn ? 'en/contact.html' : 'contatti.html') + '">' + (isEn ? 'Contact' : 'Contatti') + '</a>';
})();
</script>
</body>
</html>
